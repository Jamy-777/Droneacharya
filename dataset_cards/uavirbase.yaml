  name: UaVirBASE
  doi: 10.5281/zenodo.15391924
  modality: acoustic
provenance:
  authors:
  - Gabriel Jekateryńczuk
  - Rafał Szadkowski
  - Zbigniew Piotrowski
  institution: Military University of Technology, Warsaw
  paper: Appl. Sci. 2025, 15, 5378
  code: gitlab.com/g.jekaterynczuk/uavirbase_ssl
license: CC BY 4.0
local_artifact:
  file: Microphone_array.zip
  bytes: 13783664678
  md5: 3c4081511630f8045fda0347cac45534
  md5_verified: true
signal:
  format: WAV, 32-bit integer PCM
  sample_rate_hz: 96000
  channels: 8
  microphones: 8 x Rode NTG-2, Behringer UMC1820
  status: EMPIRICAL (n=132)
content:
  drone_recordings: 128
  ambient_recordings: 4
  ambient_s: 416
  drone: DJI Mavic 3 Cine, hovering (Static)
  design: distance 10/20 m x height 10/20 m x azimuth 8 x orientation 4 (fully crossed)
  status: EMPIRICAL (label.json)
sessions:
  days: 1
  date: '2024-11-15'
  ambient_times:
  - 09:31
  - '10:39'
  - '11:17'
  - '12:47'
  site: Warsaw (single array position)
metadata_per_recording:
- start/end time
- weather station (temperature, humidity, wind, pressure, light)
- GPS of each microphone
level_audit:
  ambient_dbfs: -24 to -14 (first 10 s)
  drone_dbfs: -28 to -13
  interpretation: 'No loudness shortcut: urban ambient is as loud as the drone.'
  drone_clipping: up to 1.2% of samples at 10 m
published_split: first 30 s train / last 10 s test within each recording (leaky)
leakage_safe_keys:
- recording_folder
role: Same-chain detection backbone (drone vs ambient) + geometry robustness.
limits:
- One drone, one day, one site, hovering only.
- 'Only 4 ambient recordings: evaluate leave-one-ambient-recording-out.'
