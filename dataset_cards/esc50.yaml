# ESC-50 dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/acoustic_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: esc50
name: ESC-50
modality: acoustic
adoption: adopted
storage:
  raw_dir: esc50
  source:
    repository: GitHub
    identifier: karolpiczak/ESC-50
structure:
  artifact:
    text: One 5 s mono WAV clip
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  capture:
    text: = artifact
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  group:
    text: '`src_file` (Freesound source recording)'
    kind: ASSESSMENT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
signal:
  container:
    value: WAV
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  sample_format:
    value: pcm_s16
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  sample_rate_hz:
    value: 44100
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  channels_per_artifact:
    value: 1
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  artifact_duration_s:
    value: 5.0
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
facts:
  primary_purpose:
    text: Environmental sound classification
    kind: FACT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  licence:
    text: 'CC BY-NC 3.0 (ESC-10: CC BY)'
    kind: FACT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  local_artifact:
    text: '`ESC-50-master.zip`'
    kind: FACT
    status: REPO_METADATA
    source: GitHub repository archive (no published checksum)
  recording_type:
    text: Freesound clips (mixed sources)
    kind: FACT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  positives:
    text: None
    kind: FACT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  negatives:
    text: Helicopter, airplane, engine, chainsaw, wind, rain, … (40 clips per class)
    kind: FACT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  same_chain_negatives:
    text: N/A (no positives)
    kind: FACT
    status: NOT_APPLICABLE
  sample_rate_format:
    text: 44.1 kHz, 16-bit, mono (all 2,000 headers)
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  clip_recording_length:
    text: 5 s
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  microphones_channels:
    text: Unknown / various
    kind: FACT
    status: UNKNOWN
  calibration:
    text: 'No'
    kind: FACT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  sessions_days:
    text: Freesound source files
    kind: FACT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  site:
    text: —
    kind: FACT
    status: UNKNOWN
  geometry_metadata:
    text: —
    kind: FACT
    status: UNKNOWN
  weather:
    text: —
    kind: FACT
    status: UNKNOWN
  speech_other_confounds:
    text: —
    kind: FACT
    status: UNKNOWN
  known_defects:
    text: Some clips clip heavily (up to 10.6%)
    kind: FACT
    status: EMPIRICAL
    n: 2000
    n_unit: file
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
  leakage_safe_keys:
    text: '`src_file` (helicopter: 15 sources for 40 clips)'
    kind: ASSESSMENT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  published_split:
    text: 5 folds by `src_file`
    kind: FACT
    status: AUTHOR_DOC
    source: ESC-50 README + meta/esc50.csv (Piczak 2015)
  level_shortcut_risk:
    text: Varies by source
    kind: ASSESSMENT
    status: EMPIRICAL
    n: 2000
    n_unit: file
    source: 'scripts/inspect_acoustic.py: all 2,000 WAV headers + level audit (interim/esc50)'
details:
  dataset:
    id: esc50
    name: ESC-50
    source: github.com/karolpiczak/ESC-50
    modality: acoustic
  license: CC BY-NC 3.0 (ESC-10 subset CC BY)
  signal:
    format: WAV, 16-bit PCM
    sample_rate_hz: 44100
    channels: 1
    clip_s: 5
    status: EMPIRICAL (n=2000)
  content:
    classes: 50
    clips_per_class: 40
    selected_negatives:
    - helicopter
    - airplane
    - engine
    - chainsaw
    - hand_saw
    - vacuum_cleaner
    - wind
    - rain
    - thunderstorm
    - train
    - insects
    - crickets
    - chirping_birds
    - washing_machine
  leakage_safe_keys:
  - src_file
  note: 'helicopter: 40 clips from only 15 source recordings'
  role: Negatives-only layer; never positives.
