# DroneRF dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/rf_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: dronerf
name: DroneRF
full_name: 'DroneRF dataset: A dataset of drones for RF-based detection, classification, and identification'
modality: rf
adoption: adopted
storage:
  raw_dir: dronerf
  source:
    repository: Mendeley Data
    identifier: 10.17632/f4c2b4n755.1
    version: '1'
structure:
  artifact:
    text: One band CSV `<BUI><L or H>_<segment>.csv` inside a class RAR inside the release zip
    kind: FACT
    status: VERIFIED
    source: 'index/dronerf: RAR headers of all 454 CSVs (scripts/build_index.py dronerf)'
  capture:
    text: L+H file pair of one segment (two simultaneous band channels)
    kind: FACT
    status: VERIFIED
    source: 'index/dronerf: RAR headers of all 454 CSVs (scripts/build_index.py dronerf)'
  group:
    text: 'BUI: each flight mode is ~5.25 s cut into ~21 segments, likely one recording'
    kind: ASSESSMENT
    status: INFERRED
    source: DroneRF paper, Al-Sa'd et al. 2019 (Europe PMC full text)
signal:
  complex_iq:
    value: false
    status: EMPIRICAL
    n: 4
    n_unit: file
    source: scripts/inspect_dronerf.py on 4 CSVs (details.empirical_inspection)
    note: signed real samples; likely the I component (INFERRED)
  scalar_dtype:
    value: decimal text holding integers (−15,342 … 15,080; lossless as int16)
    status: VERIFIED
    source: 'interim/dronerf/npy/TRANSFORM.json: all 454 CSVs parsed (scripts/convert_dronerf_npy.py)'
  container:
    value: single-row CSV in RAR
    status: VERIFIED
    source: 'interim/dronerf/npy/TRANSFORM.json: all 454 CSVs parsed (scripts/convert_dronerf_npy.py)'
  sample_rate_hz:
    value: 40000000
    status: INFERRED
    source: DroneRF paper, Al-Sa'd et al. 2019 (Europe PMC full text)
    note: 0.25 s per segment x 10M samples; not stated by the authors
  center_frequency_hz:
    status: UNKNOWN
    note: 2.4 GHz band split into L/H halves; exact edges not documented per file
  capture_bandwidth_hz:
    value: 40000000
    status: AUTHOR_DOC
    source: DroneRF paper, Al-Sa'd et al. 2019 (Europe PMC full text)
    note: up to 40 MHz per receiver
  samples_per_artifact:
    value: 10000000
    status: VERIFIED
    source: 'interim/dronerf/npy/TRANSFORM.json: all 454 CSVs parsed (scripts/convert_dronerf_npy.py)'
    note: per band file
  artifact_duration_s:
    value: 0.25
    status: INFERRED
    source: DroneRF paper, Al-Sa'd et al. 2019 (Europe PMC full text)
facts:
