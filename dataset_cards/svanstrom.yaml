# Drone detection dataset (audio part) dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/acoustic_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: svanstrom
name: Drone detection dataset (audio part)
modality: acoustic
adoption: adopted
storage:
  raw_dir: svanstrom
  source:
    repository: GitHub
    identifier: DroneDetectionThesis/Drone-detection-dataset
structure:
  artifact:
    text: One 10 s stereo WAV
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  capture:
    text: = artifact
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  group:
    text: Clip (event grouping UNKNOWN)
    kind: ASSESSMENT
    status: VERIFIED
    source: 'GitHub contents API: sizes and blob SHA-1 of Data/Audio; raw_sha256.csv'
signal:
  container:
    value: WAV
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  sample_format:
    value: pcm_s16
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  sample_rate_hz:
    value: 44100
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  channels_per_artifact:
    value: 2
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
    note: 23 of 90 dual-mono
  artifact_duration_s:
    value: 10.0
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
facts:
  primary_purpose:
    text: Multi-sensor drone detection (author)
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  licence:
    text: '"Free to download, use and edit"'
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  local_artifact:
    text: 90 WAVs from `Data/Audio`
    kind: FACT
    status: VERIFIED
    source: 'GitHub contents API: sizes and blob SHA-1 of Data/Audio; raw_sha256.csv'
  recording_type:
    text: Field, outdoor (airports)
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  positives:
    text: Drone (30 clips)
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  negatives:
    text: Background (30) + helicopter (30), same equipment
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  same_chain_negatives:
    text: '**Yes**'
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  sample_rate_format:
    text: '**44.1 kHz, 16-bit, stereo (all 90 headers)**'
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  clip_recording_length:
    text: 10 s
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  microphones_channels:
    text: Stereo; 23/90 clips dual-mono
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 90 WAV headers + level audit (interim/svanstrom)'
  calibration:
    text: 'No'
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  sessions_days:
    text: 3 airports (author)
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  site:
    text: Halmstad, Gothenburg, Malmö airports
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  geometry_metadata:
    text: Close / medium / distant (author)
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  weather:
    text: —
    kind: FACT
    status: UNKNOWN
  speech_other_confounds:
    text: —
    kind: FACT
    status: UNKNOWN
  known_defects:
    text: '`BACKGROUND_010.wav` and `BACKGROUND_019.wav` are byte-identical (also in the upstream repository)'
    kind: FACT
    status: VERIFIED
    source: 'GitHub contents API: sizes and blob SHA-1 of Data/Audio; raw_sha256.csv'
  leakage_safe_keys:
    text: clip; `BACKGROUND_010`/`019` must share a group (identical files); event grouping unknown
    kind: ASSESSMENT
    status: VERIFIED
    source: 'GitHub contents API: sizes and blob SHA-1 of Data/Audio; raw_sha256.csv'
  published_split:
    text: None
    kind: FACT
    status: AUTHOR_DOC
    source: Svanström et al., Data in Brief 2021 + repository README
  level_shortcut_risk:
    text: '**Moderate — loudness alone (1 s windows, unseen clips): AUC 0.64, balanced accuracy 0.63**; medians background −35.8, drone −24.8, helicopter −19.2 dBFS (drone in between)'
    kind: ASSESSMENT
    status: EMPIRICAL
    n: 90
    n_unit: clip
    source: docs/results/shortcut_baselines.md (scripts/run_shortcut_baselines.py; DroneacharyaData/results/shortcut_baselines/)
details:
  dataset:
    id: svanstrom
    name: Drone detection dataset (audio part)
    source: github.com/DroneDetectionThesis/Drone-detection-dataset
    modality: acoustic
  provenance:
    author: Fredrik Svanström
    institution: Halmstad University
    paper: Data in Brief 2021, doi:10.1016/j.dib.2021.107521
  license: Free to download, use and edit (repository README)
  local_artifact:
    files: 90
    folder: Data/Audio
  signal:
    format: WAV, 16-bit PCM
    sample_rate_hz: 44100
    channels: 2
    dual_mono_files: 23
    clip_s: 10
    status: EMPIRICAL (n=90)
  content:
    DRONE: 30
    HELICOPTER: 30
    BACKGROUND: 30
  level_audit:
    median_dbfs:
      BACKGROUND: -35.8
      DRONE: -24.8
      HELICOPTER: -19.2
    interpretation: 'Strong loudness shortcut: normalise level or report the energy baseline.'
  leakage_safe_keys:
  - clip (event grouping unknown)
  role: Same-chain hard negatives (helicopter) and background; small test set.
