# UAVSig dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/rf_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: uavsig
name: UAVSig
full_name: 'UAVSig: Drone RF Signal Detection and Fingerprinting Dataset'
modality: rf
adoption: adopted
storage:
  raw_dir: uavsig
  source:
    repository: UCLA Dataverse
    identifier: 10.25346/S6/LVRRAE
    version: '4.0'
structure:
  artifact:
    text: One 1 s `.mat` file (360 local; 726 in v4.0)
    kind: FACT
    status: VERIFIED
    source: 'index/uavsig: variable directory and num_transmission of the 360 local files (all controllers, all one-drone, 72 of 432 two-drone; scripts/build_index.py uavsig)'
  capture:
    text: = artifact; whether a scenario's 6 consecutive captures are continuous is not established
    kind: FACT
    status: INFERRED
    source: UAVSig Readme.pdf + uavsig_dataset_info.pdf (authors)
  group:
    text: Scenario (transmitter set × channel) + day
    kind: ASSESSMENT
    status: AUTHOR_DOC
    source: UAVSig Readme.pdf + uavsig_dataset_info.pdf (authors)
signal:
  complex_iq:
    value: true
    status: EMPIRICAL
    n: 8
    n_unit: file
    source: scripts/inspect_uavsig.py on 8 diagnostic captures (interim/uavsig/inspection)
  scalar_dtype:
    value: complex128 holding int16 codes / 32767
    status: CONFLICTING
    conflict:
    - claim: released MAT stores complex double holding int16 codes / 32767
      status: EMPIRICAL
      source: scripts/inspect_uavsig.py on 8 diagnostic captures (interim/uavsig/inspection)
      n: 8
      n_unit: file
    - claim: GNU Radio stored float32
      status: AUTHOR_DOC
      source: MILCOM 2024 paper (doi:10.1109/MILCOM61039.2024.10773837)
  container:
    value: MAT v5 (compressed); variable data + label variables
    status: EMPIRICAL
    n: 360
    n_unit: file
    source: 'index/uavsig: variable directory and num_transmission of the 360 local files (all controllers, all one-drone, 72 of 432 two-drone; scripts/build_index.py uavsig)'
  sample_rate_hz:
    value: 50000000
    status: AUTHOR_DOC
    source: UAVSig Readme.pdf + uavsig_dataset_info.pdf (authors)
  center_frequency_hz:
    value: 2443500000
    status: AUTHOR_DOC
    source: UAVSig Readme.pdf + uavsig_dataset_info.pdf (authors)
  capture_bandwidth_hz:
    value: 50000000
    status: AUTHOR_DOC
    source: UAVSig Readme.pdf + uavsig_dataset_info.pdf (authors)
  samples_per_artifact:
    value: 50000000
    status: EMPIRICAL
    n: 360
    n_unit: file
    source: 'index/uavsig: variable directory and num_transmission of the 360 local files (all controllers, all one-drone, 72 of 432 two-drone; scripts/build_index.py uavsig)'
  artifact_duration_s:
    value: 1.0
    status: AUTHOR_DOC
    source: UAVSig Readme.pdf + uavsig_dataset_info.pdf (authors)
facts:
