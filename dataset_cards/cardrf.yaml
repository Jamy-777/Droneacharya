# CardRF dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/rf_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: cardrf
name: CardRF
full_name: 'Cardinal RF (CardRF): An Outdoor UAV/UAS/Drone RF Signals with Bluetooth and WiFi Signals Dataset'
modality: rf
adoption: adopted
storage:
  raw_dir: cardrf
  source:
    repository: IEEE DataPort (University of Louisville SharePoint mirror)
    identifier: 10.21227/1XP7-GE95
structure:
  artifact:
    text: One `.mat` member of CARDRF.zip (500 zero-byte `__MACOSX` entries skipped)
    kind: FACT
    status: VERIFIED
    source: inventory of all 9,600 captures in CARDRF.zip (scripts/inspect_cardrf_raw.py)
  capture:
    text: '= artifact: one triggered 250 µs capture'
    kind: FACT
    status: VERIFIED
    source: 'index/cardrf: Frame.Date, Frame.Serial, Channel_1.NumPoints and XInc of all 9,600 captures (scripts/build_index.py cardrf)'
  group:
    text: 'Category + device, LOS and NLOS together: one unit per model; each device is one recording block'
    kind: ASSESSMENT
    status: INFERRED
