details:
  dataset:
    id: drff_r2
    name: "DRFF-R2"
    full_name: "Multi-Scenario UAV RF Signal Dataset with Real-World Acquisition and Signal Processing Benchmarking"
    year: 2026
    version: "R2"

  provenance:
    primary_paper: "arXiv:2603.00106"
    license: "CC BY 4.0"

  modality:
    - rf

  primary_tasks:
    - rf_fingerprinting
    - model_recognition
    - flight_state_analysis
    - robustness_analysis

  secondary_tasks:
    - uav_detection
    - interference_robustness
    - multi_uav_analysis

  signal:
    representation: complex_iq
    domain: time
    storage_format: mat

    sample_rate_sps:
      value: 100000000
      status: verified

    approximate_complex_samples_per_segment:
      value: 140000000
      status: verified

    dtype:
      value: float32
      status: "EMPIRICAL (n=5 files)"

  acquisition:
    center_frequencies_hz:
      outdoor:
        value: 5745000000
        status: verified

      indoor_wifi:
        value: 2437000000
        status: verified

    receiver:
      count: 2

      model:
        value: null
        status: conflicting
        notes:
          - "Paper text identifies USRP-2943 devices."
          - "A figure labels an X310."
          - "Actual files/acquisition code must resolve this."

    antenna:
      type: dual_band_omnidirectional
      gain_dbi: 5
      orientation_controlled: true

    receiver_gain:
      stored_per_file: "paper says yes; not found in inspected Dataset-3/7 files"
      fixed_globally: UNKNOWN
      status: CONFLICTING

  population:
    manufacturer:
      - DJI

    models: 8
    physical_units: 26

    physical_units_per_model:
      mini_5_pro: 1
      mini_4_pro: 5
      mini_3_pro: 2
      mavic_3: 1
      mavic_3c: 1
      mavic_air_3s: 1
      mavic_air_2s: 7
      mavic_air_2: 8

  subsets:
    dataset_1:
      name: single_drone_states
      purpose:
        - operational_state_variation
        - trajectory_variation
        - altitude_variation
        - speed_variation

    dataset_2:
      name: drone_mixed
      purpose:
        - multi_uav_signal_mixture
        - overlapping_transmitter_analysis

    dataset_3:
      name: single_drone_hover
      purpose:
        - physical_unit_variation
        - acquisition_day_variation
        - receiver_variation

    dataset_4:
      name: single_drone_dual_frequency
      purpose:
        - frequency_hopping_analysis
        - spectral_variation

    dataset_5:
      name: single_drone_inside_absorbent_material
      purpose:
        - controlled_propagation
        - environmental_effect_reduction
        - dual_vs_single_frequency_analysis

    dataset_6:
      name: wifi_mixed
      purpose:
        - wifi_interference
        - interference_robustness

    dataset_7:
      name: environment
      purpose:
        - environmental_baseline
        - negative_uav_observations

  negative_data:
    available: true
    source_subset: dataset_7
    type: recorded_environmental_baseline

    representative_of_universal_non_uav_rf: false

    acquisition_matching:
      status: "partial — Fs, Fc, dtype, length matched (EMPIRICAL n=1 vs 1); receiver, gain, day UNKNOWN"
