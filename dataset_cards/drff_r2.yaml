# DRFF-R2 dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/rf_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: drff_r2
name: DRFF-R2
full_name: Multi-Scenario UAV RF Signal Dataset with Real-World Acquisition and Signal Processing Benchmarking
modality: rf
adoption: adopted
storage:
  raw_dir: drff_r2
  source:
    version: R2
structure:
  artifact:
    text: One `.mat` file
    kind: FACT
    status: VERIFIED
    source: raw_sha256.csv inventory of the local release (731 .mat in 7 subset folders)
  capture:
    text: '= artifact: one 1.4 s capture'
    kind: FACT
    status: EMPIRICAL
    n: 5
    n_unit: file
    source: scripts/inspect_drff_r2.py + inspect_drff_environment.py on 5 diagnostic files (details.empirical_findings)
  group:
    text: Physical unit + day + receiver + configuration
    kind: ASSESSMENT
    status: EMPIRICAL
    n: 5
    n_unit: file
    source: scripts/inspect_drff_r2.py + inspect_drff_environment.py on 5 diagnostic files (details.empirical_findings)
