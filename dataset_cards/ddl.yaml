  calibration:
    text: 'No'
    kind: FACT
    status: VERIFIED
    source: Zenodo record 6459183 (licence, MD5)
  sessions_days:
    text: '**2 flight days** (29 & 31 Mar 2021), 36 recording segments'
    kind: FACT
    status: VERIFIED
    source: filename index of all 62,092 clips (interim/ddl/ddl_filename_index.csv)
  site:
    text: '31 Mar: Phantom 17:14–18:20 then Mini 18:24–19:10 → **same site that day** (paper implied separate sites)'
    kind: FACT
    status: CONFLICTING
