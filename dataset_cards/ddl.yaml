# DDL dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/acoustic_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: ddl
name: DDL
full_name: 'DDL: Dataset and Baseline Methods for Drone Detection and Localization Using Sound'
modality: acoustic
adoption: adopted
storage:
  raw_dir: ddl
  source:
    repository: Zenodo
    identifier: 10.5281/zenodo.6459183
structure:
  artifact:
    text: One 0.1 s 8-channel WAV clip
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 62,103 WAV headers (interim/ddl)'
  capture:
    text: Gap-free run of a segment's clips (38 runs in 36 segments); empty and unparseable clips belong to no capture
    kind: FACT
    status: VERIFIED
    source: 'index/ddl: WAV headers and file names of all 62,103 clips (scripts/build_index.py ddl)'
  group:
    text: Flight day + recording segment
    kind: ASSESSMENT
    status: VERIFIED
    source: filename index of all 62,092 clips (interim/ddl/ddl_filename_index.csv)
signal:
  container:
    value: WAV
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 62,103 WAV headers (interim/ddl)'
  sample_format:
    value: pcm_s32
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 62,103 WAV headers (interim/ddl)'
  sample_rate_hz:
    value: 96000
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 62,103 WAV headers (interim/ddl)'
  channels_per_artifact:
    value: 8
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 62,103 WAV headers (interim/ddl)'
  artifact_duration_s:
    value: 0.1
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 62,103 WAV headers (interim/ddl)'
    note: 3,945 clips are empty 44-byte files
facts:
  primary_purpose:
    text: Drone detection + localization (author)
    kind: FACT
    status: AUTHOR_DOC
    source: DDL paper (Safavi et al.) and Zenodo 6459183 description
  licence:
    text: CC BY 4.0
    kind: FACT
    status: REPO_METADATA
    source: Zenodo record 6459183 (licence, MD5)
  local_artifact:
    text: '`MLSP_2022_Real_Data.zip` 12.6 GB, MD5 OK'
    kind: FACT
    status: VERIFIED
    source: Zenodo record 6459183 (licence, MD5)
  recording_type:
    text: Field, outdoor
    kind: FACT
    status: AUTHOR_DOC
    source: DDL paper (Safavi et al.) and Zenodo 6459183 description
  positives:
    text: DJI Mini 2, Phantom 4 Pro
    kind: FACT
    status: AUTHOR_DOC
    source: DDL paper (Safavi et al.) and Zenodo 6459183 description
  negatives:
    text: '**None in release** — 0 `XXXX` clips (EMPIRICAL, all 62,092 parsed)'
    kind: FACT
    status: CONFLICTING
    conflict:
    - claim: paper and Zenodo describe an XXXX no-drone class and environment-only sessions
      status: AUTHOR_DOC
      source: DDL paper (Safavi et al.) and Zenodo 6459183 description
    - claim: 0 of 62,092 released clips carry the XXXX class code
      status: VERIFIED
      source: filename index of all 62,092 clips (interim/ddl/ddl_filename_index.csv)
  same_chain_negatives:
    text: 'No'
    kind: FACT
    status: VERIFIED
    source: filename index of all 62,092 clips (interim/ddl/ddl_filename_index.csv)
  sample_rate_format:
    text: '**96 kHz, 32-bit integer PCM, 8 ch (all 62,103 headers)**'
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 62,103 WAV headers (interim/ddl)'
  clip_recording_length:
    text: 0.1 s clips (62,092) ≈ 103.5 min
    kind: FACT
    status: VERIFIED
    source: 'scripts/inspect_acoustic.py: all 62,103 WAV headers (interim/ddl)'
  microphones_channels:
