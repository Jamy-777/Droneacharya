      source: filename index of all 62,092 clips (interim/ddl/ddl_filename_index.csv)
  geometry_metadata:
    text: Range 0–249 m, bearing, altitude per clip (filename)
    kind: FACT
    status: VERIFIED
    source: filename index of all 62,092 clips (interim/ddl/ddl_filename_index.csv)
  weather:
    text: Temperature only (1 value per day)
    kind: FACT
    status: VERIFIED
    source: filename index of all 62,092 clips (interim/ddl/ddl_filename_index.csv)
  speech_other_confounds:
