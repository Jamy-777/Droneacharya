# RMA Drone RF Dataset dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/rf_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: rma
name: RMA Drone RF Dataset
full_name: Drone RF Dataset (Royal Military Academy / KU Leuven)
modality: rf
adoption: adopted
storage:
  raw_dir: rma
  source:
    repository: KU Leuven Research Data Repository
    identifier: 10.48804/HZRVNZ
    version: '1.0'
structure:
  artifact:
    text: One `.mat` member of a system archive (zip)
    kind: FACT
    status: VERIFIED
    source: central directories of all 16 zips
  capture:
    text: = artifact; files are separate captures seconds apart, not continuous
    kind: FACT
    status: EMPIRICAL
    n: 9
    n_unit: file
    source: scripts/inspect_rma.py on 9 captures
  group:
    text: Archive = one session of 1–22 min (MAT creation times of all 812 files)
    kind: ASSESSMENT
    status: VERIFIED
    source: 'index/rma: MAT header and uhd_samps length of all 812 files (scripts/build_index.py rma)'
signal:
  complex_iq:
    value: true
    status: VERIFIED
    source: 'index/rma: MAT header and uhd_samps length of all 812 files (scripts/build_index.py rma)'
  scalar_dtype:
    value: complex128 (HDF5 compound) holding int16 codes / 32768
    status: EMPIRICAL
    n: 9
    n_unit: file
    source: scripts/inspect_rma.py on 9 captures (interim/rma/inspection)
  container:
    value: MAT v7.3 (HDF5); variable uhd_samps, shape (1, N)
    status: VERIFIED
    source: 'index/rma: MAT header and uhd_samps length of all 812 files (scripts/build_index.py rma)'
  sample_rate_hz:
    value: 100000000
    status: AUTHOR_DOC
    source: README.txt (authors)
  center_frequency_hz:
    value: 2440000000
    status: AUTHOR_DOC
    source: README.txt (authors)
  capture_bandwidth_hz:
    value: 100000000
    status: INFERRED
    source: README.txt (authors)
    note: complex sampling at 100 MS/s
  samples_per_artifact:
    varies: true
    status: VERIFIED
    source: 'index/rma: MAT header and uhd_samps length of all 812 files (scripts/build_index.py rma)'
    note: 10M in 11 archives; 20M mini2vid and inspire2Vid; 100M the four Mavic archives
  artifact_duration_s:
    varies: true
    status: VERIFIED
    source: 'index/rma: MAT header and uhd_samps length of all 812 files (scripts/build_index.py rma)'
    note: 0.1 s / 0.2 s / 1 s by archive, constant within each
facts:
  primary_purpose:
    text: RC + video-link identification; novelty detection (per publication titles)
    kind: FACT
    status: AUTHOR_DOC
    source: README.txt (authors)
  year:
    text: 2024 release (v1.0); captures created 2022 (MAT header, n=1)
    kind: FACT
    status: REPO_METADATA
    source: KU Leuven RDR API listing (manifests/rma_file_listing.json)
  license:
    text: '**CC BY-NC 4.0** (non-commercial)'
    kind: FACT
    status: REPO_METADATA
