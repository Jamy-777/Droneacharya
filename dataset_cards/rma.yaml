details:
  # RMA (Royal Military Academy / KU Leuven) Drone RF Dataset card
  #
  # Evidence levels:
  #   REPO_METADATA     KU Leuven RDR (Dataverse) API: file list, sizes, MD5, license, version
  #   AUTHOR_README     README.txt shipped with the dataset
  #   AUTHOR_CODE       signal_visualize.m / get_spectrogram2.m shipped with the dataset
  #   REMOTE_LISTING    zip contents read remotely via HTTP Range (no download), all 16 archives
  #   EMPIRICAL (n=..)  measured by us on downloaded captures
  #   INFERRED          derived from the above; requires confirmation
  #   UNKNOWN           not established
  #
  # Paper-level claims (TCCN 2022, ICACT 2023) have not been read yet and are not used here.

  dataset:
    id: rma
    name: "RMA Drone RF Dataset"
    full_name: "Drone RF Dataset (Royal Military Academy / KU Leuven)"
    version: "1.0"
    release_date: "2024-01-16"
    doi: "10.48804/HZRVNZ"
    status: REPO_METADATA

  provenance:
    authors: ["Sanjoy Basak", "Sofie Pollin", "Bart Scheers"]
    institutions: ["KU Leuven (Networked Systems, WaveCore)", "Royal Military Academy (CISS, Radio Networks)"]
    repository: "KU Leuven Research Data Repository (RDR, Dataverse)"
    project: "PhD: Drone Detection and Classification using Artificial Intelligence based RF Sensing"
    related_publications:
      - "Basak et al., Combined RF-Based Drone Detection and Classification, IEEE TCCN 8(1), 2022, doi:10.1109/TCCN.2021.3099114"
      - "Basak et al., Autoencoder based framework for drone RF signal classification and novelty detection, ICACT 2023, doi:10.23919/ICACT56868.2023.10079363"
    not_to_be_confused_with: "Zenodo 10.5281/zenodo.21428081 (ZHAW, 2026): different drones (DJI, Futaba T7/T14, Graupner, Taranis, Turnigy) + Wi-Fi/Bluetooth background, spectrogram images only."

  license:
    type: "CC BY-NC 4.0"
    status: REPO_METADATA
    note: "Non-commercial. Fine for research; matters if Droneacharya is ever commercialised."

  modality:
    - rf

  primary_tasks:
    - uav_system_identification
    - rc_vs_video_link_classification
  secondary_tasks:
    - novelty_detection  # per ICACT 2023 title; protocol not yet read

  public_release:
    archives: 16
    mat_files: 812
    total_size_gb: 46.7  # decimal GB; = 43.5 GiB, which is what the KU Leuven page shows
    checksums: "MD5 per archive (REPO_METADATA)"
    zip_compression_ratio: "~0.96 (MAT payload already compressed)"
    extras: ["README.txt", "signal_visualize.m", "get_spectrogram2.m"]

  population:
    readme_list:  # AUTHOR_README, verbatim order
      - "Spektrum DX4e remote controller"
      - "DJI Mini 2 drone + remote controller"
      - "DJI Inspire 2 drone + remote controller"
      - "DJI Matrice 300 drone + remote controller"
      - "Taranis Q X7 remote controller"
      - "Nine Eagles remote controller"
      - "WLtoys remote controller"
      - "Q205 remote controller"
      - "SJRC F11 Pro drone + remote controller"
    archives:  # REMOTE_LISTING: archive -> files
      Spektrum_DX4e: 71
      mini2RC: 71
      mini2vid: 71
      inspire2RC: 71
      inspire2Vid: 71
      matriceRC: 71
      matricevid: 71
      Frysky: 51
      NineEagles: 51
      wltoys: 51
      Q205: 51
      SJRC_pro: 51
      MavicRC1: 15
      MavicRC2: 16
      MavicVid1: 14
      MavicVid2: 15
    documentation_conflicts:
      - "Mavic archives (60 files, ~19 GB) are not in the README list; Mavic model unknown."
      - "README says 'Taranis Q X7'; archive is named 'Frysky' (FrSky makes the Taranis) — INFERRED to be the same system."
      - "README says SJRC F11 Pro 'drone + remote controller', but only one SJRC archive exists; whether it is RC, video or both is UNKNOWN."
    physical_units_per_system:
      value: 1
      status: INFERRED
      consequence: "System identity and physical-unit identity are inseparable."

  signal:
    representation: complex_iq
    sample_rate_sps: {value: 100000000, status: AUTHOR_README}
    center_frequency_hz: {value: 2440000000, status: AUTHOR_README}
    capture_bandwidth_hz: {value: 100000000, status: INFERRED}  # complex sampling at 100 MS/s
    storage:
      format: "MAT v7.3 (HDF5)"
      variable: "uhd_samps"
      stored_type: "complex double (HDF5 compound real/imag, float64) holding int16 codes / 32768"
      shape: "(1, N)"
      status: "EMPIRICAL (n=9: 8 audited archives + SJRC_pro)"
    samples_per_file:
      status: "EMPIRICAL (n=9)"
      by_archive:
        Frysky: {samples: 10000000, duration_ms: 100}
        Spektrum_DX4e: {samples: 10000000, duration_ms: 100}
        SJRC_pro: {samples: 10000000, duration_ms: 100}
        mini2RC: {samples: 10000000, duration_ms: 100}
        matricevid: {samples: 10000000, duration_ms: 100}
        mini2vid: {samples: 20000000, duration_ms: 200}
        MavicRC1: {samples: 100000000, duration_ms: 1000}
        MavicVid1: {samples: 100000000, duration_ms: 1000}
      consequence: "Capture length differs by class (100 ms to 1 s). Fixed-length windows must be cut from every file; never use file length as a feature."
    file_created:
      status: "EMPIRICAL (n=9, MAT header)"
      april_2022_session: "Apr 4–6 2022: Mini 2, Matrice, Spektrum DX4e, Frysky (SJRC_pro: May 5 2022)"
      mavic_session: "Oct 30 2022 (MavicVid1), Nov 2 2022 (MavicRC1)"
      consequence: "Mavic was recorded ~7 months after the rest and is absent from the README: session and class are confounded for Mavic."

  acquisition:
