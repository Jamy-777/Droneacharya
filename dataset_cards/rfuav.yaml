# RFUAV dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/rf_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: rfuav
name: RFUAV
full_name: 'RFUAV: A Benchmark Dataset for Unmanned Aerial Vehicle Detection and Identification'
modality: rf
adoption: adopted
storage:
  raw_dir: rfuav
  source:
    repository: Hugging Face
    identifier: kitofrank/RFUAV
  name_map: manifests/rfuav_local_to_official.json
structure:
  artifact:
    text: One `.iq` chunk inside a class RAR (358 chunks)
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  capture:
    text: Gap-free run of a pack's chunks in time order; 3 packs miss one chunk and split into two captures
    kind: FACT
    status: INFERRED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  group:
    text: Pack (stronger grouping unresolved)
    kind: ASSESSMENT
    status: INFERRED
    source: dataset_cards/rfuav.yaml details
signal:
  complex_iq:
    value: true
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  scalar_dtype:
    value: float32
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  container:
    value: interleaved binary .iq chunks (I0,Q0,I1,Q1...) + one XML per pack, in class RARs
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  sample_rate_hz:
    value: 100000000
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
    note: sampled packs
  center_frequency_hz:
    varies: true
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
    note: 'per pack in XML: 5.76–5.80 GHz for Avata 2, FPV Combo, Mavic 3 Pro, Autel EVO Nano; 2.41–2.47 GHz for every other class (31 controllers, Mini 3, Mini 4 Pro)'
  capture_bandwidth_hz:
    value: 100000000
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
    note: sampled packs
  samples_per_artifact:
    value: 100000000
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
    note: complex samples per full 1 s chunk; the last chunk of 6 packs is shorter
  artifact_duration_s:
    value: 1.0
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
facts:
  primary_purpose:
    text: Identification + detection benchmark
    kind: FACT
    status: AUTHOR_DOC
    source: RFUAV paper (arXiv:2503.09033) + GitHub README (kitoweeknd/RFUAV)
  year:
    text: '2025'
    kind: FACT
    status: AUTHOR_DOC
    source: RFUAV paper (arXiv:2503.09033) + GitHub README (kitoweeknd/RFUAV)
  license:
    text: Apache-2.0 (HF artifact); raw scope verify
    kind: FACT
    status: REPO_METADATA
    source: Hugging Face kitofrank/RFUAV file listing (manifests/rfuav_hf_listing.json)
  full_reported_scale:
    text: ~1.3 TB / 37 distinct UAVs reported
    kind: FACT
    status: AUTHOR_DOC
    source: RFUAV paper (arXiv:2503.09033) + GitHub README (kitoweeknd/RFUAV)
  public_release_caveat:
    text: '**HF repo (2026-07-27): 37 class archives (109.2 GB) + `ValidationSet_5Drones` (5 DJI aircraft, 162.1 GB) + image set/weights (27.7 GB) ≈ 299 GB**; full 1.3 TB corpus not public'
    kind: FACT
    status: REPO_METADATA
    source: Hugging Face kitofrank/RFUAV file listing (manifests/rfuav_hf_listing.json)
  raw_representation:
    text: Complex IQ
    kind: FACT
    status: EMPIRICAL
    n: 1
    n_unit: file
    source: 'scripts/inspect_rfuav.py: XML of 3 packs, IQ of 1 file (details.empirical_samples)'
  scalar_dtype:
    text: '**float32 — VERIFIED (XML DataType ''Complex Float'' in all 53 packs)**'
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  raw_format:
    text: interleaved binary `.iq` + XML per pack (all 37 archives listed)
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  i_q_layout:
    text: '`I0,Q0,I1,Q1...`'
    kind: FACT
    status: EMPIRICAL
    n: 1
    n_unit: file
    source: 'scripts/inspect_rfuav.py: XML of 3 packs, IQ of 1 file (details.empirical_samples)'
  samples_capture_chunk:
    text: '**100M complex per full chunk — VERIFIED (sizes of all 358 chunks)**'
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  chunk_duration:
    text: '**1.0 s per chunk; last chunk of 6 packs shorter — VERIFIED**'
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  sample_rate:
    text: '**100 MS/s — VERIFIED (all 53 pack XMLs)**'
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  center_frequency:
    text: 'Per pack: 5.76–5.80 GHz (Avata 2, FPV Combo, Mavic 3 Pro, Autel EVO Nano); 2.41–2.47 GHz (31 controllers, Mini 3, Mini 4 Pro)'
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  absolute_frequency_coverage:
    text: 'Fc ± 50 MHz per pack: 2.36–2.52 GHz and 5.71–5.85 GHz'
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  if_capture_bandwidth:
