  source:
    repository: Hugging Face
    identifier: kitofrank/RFUAV
  name_map: manifests/rfuav_local_to_official.json
structure:
  artifact:
    text: One 1 s `.iq` chunk (with its XML) inside a class RAR
    status: VERIFIED
  capture:
    text: 'Pack: the pack''s consecutive 1 s chunks concatenated (continuity across chunks not yet checked)'
    status: INFERRED
  group:
    text: Pack (stronger grouping unresolved)
    status: ASSESSMENT
signal:
  complex_iq:
    value: true
    status: VERIFIED
  scalar_dtype:
    value: float32
    status: VERIFIED
  container:
    value: interleaved binary .iq (I0,Q0,I1,Q1...) + XML per pack, in class RARs
    status: VERIFIED
  sample_rate_hz:
    value: 100000000
    status: VERIFIED
    note: sampled packs
  center_frequency_hz:
    varies: true
    status: VERIFIED
    note: per pack in XML; observed 2.440 / 2.450 GHz
  capture_bandwidth_hz:
    value: 100000000
    status: VERIFIED
    note: sampled packs
  samples_per_artifact:
    value: 100000000
    status: VERIFIED
    note: complex samples per 1 s chunk
  artifact_duration_s:
    value: 1.0
    status: VERIFIED
