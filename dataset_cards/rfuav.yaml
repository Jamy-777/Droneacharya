# RFUAV dataset card (schema v1).
#
# Everything above `details` is validated by src/droneacharya/cards/schema.py
# (unknown keys are errors). `facts` and `supplementary` generate
# docs/datasets/rf_compatibility_matrix.md (scripts/build_matrices.py).
# `details` is the pre-schema card, kept verbatim with its comments until its
# content moves into typed fields. Status UNGRADED = carried over from the
# hand-written matrix without an evidence marker; grade it before citing it.

schema_version: 1
id: rfuav
name: RFUAV
full_name: 'RFUAV: A Benchmark Dataset for Unmanned Aerial Vehicle Detection and Identification'
modality: rf
adoption: adopted
storage:
