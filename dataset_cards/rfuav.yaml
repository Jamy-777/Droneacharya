    kind: FACT
    status: UNKNOWN
  gain_scale:
    text: 'ScaleFactor by class: 90 (all DJI/Autel aircraft), 85/80 (SIYI, YUNZHUO), 60 (others); semantics not established — do not treat as gain'
    kind: FACT
    status: VERIFIED
    source: 'index/rfuav: all 37 RAR listings and all 53 pack XMLs (scripts/build_index.py rfuav)'
  snr_metadata:
