cross_dataset:
  Sample rates:
    text: 96 kHz (DDL, UaVirBASE), 50 kHz (DroneNoise), 44.1 kHz (Mięsikowska, Svanström, ESC-50) → common band limited to 22.05 kHz unless 44.1 kHz sets are excluded
    status: UNGRADED
  Same-chain negatives:
    text: Only UaVirBASE (4 ambient recordings, 416 s) and Svanström (30 background + 30 helicopter, 10 s each)
    status: UNGRADED
  Main shortcut:
    text: 'Recording chain ↔ label: drones come from 5 chains, most negatives from others. Run a "predict the dataset" baseline and leave-one-dataset-out tests'
    status: ASSESSMENT
  Units:
    text: DroneNoise M6–M9 in pascals (M1–M5 ±5 dB); all others uncalibrated full-scale
    status: UNGRADED
