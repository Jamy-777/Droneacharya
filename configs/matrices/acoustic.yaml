cross_dataset_heading: Cross-dataset facts
cross_dataset:
  Sample rates:
    text: 96 kHz (DDL, UaVirBASE), 50 kHz (DroneNoise), 44.1 kHz (Mięsikowska, Svanström, ESC-50) → common band limited to 22.05 kHz unless 44.1 kHz sets are excluded
    kind: FACT
    status: EMPIRICAL
    n: 362
    n_unit: file
    source: 'per-dataset sample_rate_hz fields (weakest: Mięsikowska, 362 files of 4 zips)'
  Same-chain negatives:
    text: Only UaVirBASE (4 ambient recordings, 416 s) and Svanström (30 background + 30 helicopter, 10 s each)
    kind: FACT
    status: AUTHOR_DOC
    source: UaVirBASE label.json + Svanström paper (same equipment)
  Main shortcut:
    text: 'Recording chain ↔ label. **Measured (32 band energies 0–8 kHz after resampling to 16 kHz, unseen groups): the dataset of a 1 s window is named with balanced accuracy 0.69 [0.63, 0.74], p=0.00 (6 datasets, chance 0.17), and 0.81 [0.74, 0.88], p=0.00 among drone windows only (5 datasets, chance 0.20), loudness removed** — lower bounds; drones-only removes the drone/non-drone content difference. Use leave-one-dataset-out tests and report this baseline beside every cross-dataset result'
    kind: ASSESSMENT
    status: EMPIRICAL
    n: 1112
    n_unit: window
    source: docs/results/shortcut_baselines.md (pooled out-of-fold, group permutation, group bootstrap; scripts/run_shortcut_baselines.py)
  Units:
    text: DroneNoise M6–M9 in pascals (M1–M5 ±5 dB); all others uncalibrated full-scale
    kind: FACT
    status: EMPIRICAL
    n: 9
    n_unit: file
    source: DroneNoise calibration-tone audit (scripts/inspect_acoustic.py)
