# Layout of docs/datasets/acoustic_compatibility_matrix.md. Cell contents live in the cards.

modality: acoustic
output: docs/datasets/acoustic_compatibility_matrix.md
preamble: '# Droneacharya Acoustic Dataset Compatibility Matrix


  Every cell is a graded claim in `dataset_cards/<dataset>.yaml`: kind (FACT or ASSESSMENT), evidence status, source, and for EMPIRICAL the sample size with its unit. Status definitions and grading rules: `src/droneacharya/cards/schema.py`. Per-dataset counts and every CONFLICTING or UNKNOWN claim: `evidence_audit.md`. Inline markers in cell text (`author doc`, `n=…`, INFERRED) are kept for reading; the graded status in the card is authoritative.


  *Provisional role* are Droneacharya decisions from `configs/dataset_roles.yaml`, not dataset properties.


  Audit scripts: `scripts/inspect_acoustic.py`; per-file audit CSVs in `interim/<dataset>/`.


  Datasets were selected on 2026-10-05 (selection record and audit conclusions: `acoustic_notes.md`) and downloaded 2026-10-06. Every archive with a published checksum matched it; Svanström and ESC-50 come from GitHub, which publishes none (Svanström sizes and three blob hashes checked against the GitHub API).'
