[project]
name = "droneacharya"
version = "0.1.0"
description = "Passive multimodal (RF + acoustic) UAV detection research prototype"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
